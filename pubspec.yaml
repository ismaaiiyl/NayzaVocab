name: nayza_vocab
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_tts: ^4.2.5
  path_provider: ^2.1.5
  intl: ^0.20.2
  provider: ^6.1.5+1
  audioplayers: ^6.6.0
  uuid: ^4.5.3
  grouped_list: ^6.0.0
  equatable: ^2.0.8
  google_fonts: ^8.0.2
  lucide_icons: ^0.257.0
  image: ^4.8.0
  file_picker: ^10.3.10
  share_plus: ^12.0.2
  vibration: ^3.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/icon/
